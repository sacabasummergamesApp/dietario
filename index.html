<title>Gestanut · Recetario para el embarazo</title>
<style>:root{--cream:#F7F1E6;--cream2:#EFE6D5;--sage:#7C9A7E;--sage-d:#587A5D;--sage-l:#DCE7D9;--terra:#C4694A;--terra-l:#F3D9CE;--ink:#2B2A26;--mute:#6F6B60;--card:rgba(255,255,255,.72);--line:rgba(60,55,40,.10);--ok:#4E8A57;--warn:#C98A22;--bad:#B5483A;--r:22px;--sh:0 6px 22px rgba(70,60,30,.10);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%,#fff8ec 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#e8f0e4 0,transparent 55%),var(--cream);min-height:100vh;line-height:1.45}
h1,h2,h3{font-family:"New York",ui-serif,Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{display:none}
.main{flex:1;min-width:0;padding:18px 16px calc(96px + var(--safe-b));max-width:1180px;margin:0 auto;width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safe-b));background:rgba(255,252,245,.78);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 10px;border-radius:14px;min-width:56px}
.tab .i{font-size:22px;line-height:1}.tab.on{color:var(--sage-d);font-weight:600}
@media(min-width:860px){.tabbar{display:none}.side{display:flex;flex-direction:column;gap:6px;width:230px;padding:26px 14px;position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:rgba(255,252,245,.55);backdrop-filter:blur(16px)}
.side .brand{font-family:ui-serif,Georgia,serif;font-size:22px;margin:0 8px 14px;color:var(--sage-d)}
.side .tab{flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;width:100%;justify-content:flex-start;border-radius:14px}.side .tab.on{background:var(--sage-l)}
.main{padding:30px 34px 60px}}
.hero{padding:6px 2px 14px}.hero h1{font-size:clamp(28px,5vw,40px)}.hero p{color:var(--mute);margin:6px 0 0;max-width:62ch}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--sage-l);border:1px solid rgba(88,122,93,.25);color:#2f4a35;border-radius:16px;padding:11px 14px;font-size:14px;margin:12px 0}
.sec{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 18px;margin:14px 0;box-shadow:var(--sh)}
.sec>h2{font-size:19px;display:flex;align-items:center;gap:8px}.sec .sub{color:var(--mute);font-size:13px;margin:3px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;display:inline-flex;align-items:center;gap:7px;min-height:40px;transition:.15s}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff;box-shadow:0 3px 10px rgba(88,122,93,.35)}
.chip.tag{background:var(--sage-l);border-color:transparent;color:#2f4a35}.chip.tag.red{background:var(--terra-l);color:#7a3a25}
.chip.tag.lock{background:#eee8da;color:#6b6350}
.chip .x{opacity:.6;font-weight:700;margin-left:2px}
.cuis{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-top:12px}
.cu{position:relative;border:2px solid transparent;border-radius:18px;overflow:hidden;padding:0;aspect-ratio:1.25;text-align:left;color:#fff;display:flex;align-items:flex-end;background:#888;transition:.15s}
.cu .em{position:absolute;right:8px;top:2px;font-size:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.cu .lb{position:relative;width:100%;padding:22px 11px 9px;font-weight:600;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.cu.on{border-color:#fff;outline:3px solid var(--sage-d);transform:scale(.97)}.cu.on::after{content:"✓";position:absolute;left:8px;top:6px;background:#fff;color:var(--sage-d);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-weight:800;font-size:13px}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:14px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;min-width:76px;border:0;background:transparent;border-radius:11px;padding:10px 8px;font-size:14px;min-height:42px}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font-weight:600;color:var(--sage-d)}
.sev{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sev button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:left;min-height:64px}
.sev button.on{border-color:var(--sage-d);background:var(--sage-l)}.sev b{display:block;font-size:15px}.sev span{font-size:12px;color:var(--mute)}
.ac{position:relative}.ac input,.inp{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:#fff;min-height:46px}
.ac input:focus,.inp:focus{outline:2px solid var(--sage);border-color:transparent}
.dd{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:4px;box-shadow:0 12px 30px rgba(0,0,0,.15);max-height:280px;overflow:auto}
.dd button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:11px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.dd button:hover{background:var(--sage-l)}.dd small{color:var(--mute);margin-left:auto}
.stepper{display:flex;align-items:center;gap:6px}.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px}
.stepper b{min-width:34px;text-align:center;font-size:20px}
.cta{width:100%;border:0;border-radius:20px;padding:18px;font-size:17px;font-weight:700;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,var(--terra),#d98466);box-shadow:0 10px 26px rgba(196,105,74,.4);min-height:58px}
.cta:active{transform:scale(.99)}.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 16px;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:7px}
.btn.pri{background:var(--sage-d);color:#fff;border-color:transparent}.btn.ter{background:var(--terra);color:#fff;border-color:transparent}.btn.ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px;margin-top:14px}
.card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line);display:flex;flex-direction:column;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ph{position:relative;aspect-ratio:1.55;display:grid;place-items:center;overflow:hidden;background:#ccc}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plate{width:56%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f4efe6 70%);box-shadow:0 10px 24px rgba(0,0,0,.28),inset 0 0 0 8px rgba(255,255,255,.7);display:grid;place-items:center;font-size:clamp(30px,6vw,46px);line-height:1;text-align:center}
.plate span{display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
.ph .bd{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:#333;letter-spacing:.02em}
.pill.ok{color:#fff;background:var(--ok)}.pill.w{color:#fff;background:var(--warn)}.pill.cu2{background:rgba(0,0,0,.45);color:#fff}
.card .bd2{padding:14px 15px 15px;display:flex;flex-direction:column;gap:8px;flex:1}.card h3{font-size:18px;line-height:1.2}.card p{margin:0;color:var(--mute);font-size:13.5px}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute)}.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ddd;margin-right:2px}.dots i.f{background:var(--sage-d)}
.nut{font-size:12.5px;color:#4a473e;background:var(--cream);border-radius:12px;padding:7px 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tg{font-size:11.5px;background:var(--sage-l);color:#2f4a35;border-radius:999px;padding:3px 9px}
.fav{position:absolute;right:10px;top:10px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.warnbox{background:#FFF4DB;border:1px solid #EBCB85;color:#5d4310;border-radius:16px;padding:12px 14px;font-size:14px;margin:10px 0}.warnbox ul{margin:6px 0 0 18px;padding:0}
.alert{background:#FBE5E0;border:1px solid #E5A69B;color:#6b2a20;border-radius:16px;padding:12px 14px;font-size:14px;margin:10px 0}
.det{display:grid;gap:18px}@media(min-width:1000px){.det{grid-template-columns:minmax(340px,430px) 1fr;align-items:start}.det .stk{position:sticky;top:20px}}
.hdr{aspect-ratio:1.3;border-radius:26px;overflow:hidden;box-shadow:var(--sh)}.hdr .ph{height:100%;aspect-ratio:auto}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}.fact{background:#fff;border-radius:16px;padding:10px 12px;border:1px solid var(--line)}.fact small{display:block;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}.fact b{font-size:16px}
.ing{list-style:none;margin:8px 0 0;padding:0}.ing li{display:flex;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line);align-items:center;flex-wrap:wrap}.ing li b{min-width:92px;color:var(--terra);font-weight:700}
.ing .em{font-size:20px}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}.step .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-weight:700}
.step h4{margin:2px 0 4px;font-size:16px}.step p{margin:0}.step .sf{font-size:13px;color:#2f4a35;background:var(--sage-l);border-radius:10px;padding:5px 9px;margin-top:6px;display:inline-block}
table.nt{width:100%;border-collapse:collapse;margin-top:6px}.nt td{padding:7px 4px;border-bottom:1px solid var(--line)}.nt td:last-child{text-align:right;font-weight:600}
.sel{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;font:inherit;min-height:42px;max-width:100%}
.acc summary{cursor:pointer;font-weight:600;padding:8px 0;list-style:none}.acc summary::-webkit-details-marker{display:none}.acc summary::before{content:"▸ ";color:var(--sage-d)}.acc[open] summary::before{content:"▾ "}
.sl h3{margin:16px 0 6px;font-size:16px;color:var(--sage-d)}.sl label{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px;min-height:48px}.sl input{width:22px;height:22px;accent-color:var(--sage-d)}.sl .done span{text-decoration:line-through;opacity:.5}
.week{display:grid;gap:10px;grid-template-columns:1fr}@media(min-width:720px){.week{grid-template-columns:repeat(7,1fr)}}
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:7px}.day h4{margin:0;font-size:13px;text-transform:capitalize}.day.today{outline:2px solid var(--terra)}
.slot{border:1.5px dashed rgba(0,0,0,.15);border-radius:12px;min-height:54px;padding:6px 8px;background:rgba(255,255,255,.6);font-size:12.5px;text-align:left;width:100%}.slot small{display:block;color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}.slot.f{border-style:solid;border-color:var(--sage);background:#fff}
.modal{position:fixed;inset:0;z-index:60;background:rgba(30,28,20,.45);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}.mb{background:var(--cream);border-radius:26px 26px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:18px 18px calc(22px + var(--safe-b))}
@media(min-width:700px){.mb{border-radius:26px}}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:#2b2a26;color:#fff;padding:12px 18px;border-radius:14px;z-index:90;font-size:14px;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .25s}
@media(min-width:860px){.toast{bottom:30px}}
#cook{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#fbf6ea,#e9f0e5);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(16px + var(--safe-b));overflow:auto}
#cook .top{display:flex;align-items:center;gap:10px}.prog{height:8px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--terra));transition:width .3s}
#cook .big{font-size:clamp(24px,5.4vw,40px);line-height:1.3;margin:10px 0 14px;font-family:ui-serif,Georgia,serif}
#cook .cw{max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1}
.timer{background:#fff;border-radius:22px;padding:14px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);margin:8px 0}.timer .t{font-size:44px;font-variant-numeric:tabular-nums;font-weight:700;flex:1}
.nav2{display:flex;gap:12px;margin-top:auto;padding-top:14px}.nav2 .btn{flex:1;min-height:64px;font-size:18px;justify-content:center;border-radius:20px}
.muted{color:var(--mute);font-size:13px}.small{font-size:13px}.sp{height:8px}.hide{display:none!important}
.kcalbar{display:flex;height:9px;border-radius:9px;overflow:hidden;margin:8px 0}.kcalbar i{display:block}
a{color:var(--sage-d)}.ref{padding:12px 0;border-bottom:1px solid var(--line)}.ref b{display:block}
.det{grid-template-columns:minmax(0,1fr)}.det>*{min-width:0}
@media(min-width:1000px){.det{grid-template-columns:minmax(340px,430px) minmax(0,1fr)}}
.ing li{flex-wrap:nowrap}.ing li>span:last-child{flex:1;min-width:0}.ing li b{min-width:70px}
.facts{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.row>.btn{max-width:100%}

.pend{position:absolute;left:8px;bottom:8px;font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);color:#5a5340}

#cook .instr{background:linear-gradient(160deg,#FCE3D3,#F6D2BC);border:2px solid var(--terra);border-radius:22px;padding:14px 18px 6px;margin:12px 0;box-shadow:var(--sh)}#cook .instr>b{color:#8A3F27;font-size:15px}#cook .instr .big{margin:6px 0 10px}

.nsearch{position:relative;margin:0 0 12px}.nsearch input{width:100%;min-height:48px;font-size:16px;padding:10px 16px;border:2px solid var(--terra);border-radius:16px;background:#fff}
.rqres{position:absolute;left:0;right:0;top:52px;z-index:20;background:#fff;border:1px solid #e3d3c6;border-radius:14px;box-shadow:var(--sh);max-height:60vh;overflow:auto}.rqres.hide{display:none}
.rqres button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 14px;border:0;background:none;font:inherit;cursor:pointer;min-height:44px}.rqres button:hover{background:#FCE3D3}.rqres small{color:#777;white-space:nowrap}

/* v2.6: badge almacenamiento, alergias, contadores, móvil */
.sbadge{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid;line-height:1.2;text-align:left}
.sbadge.ok{background:#E4F1E6;color:#2F6B3C;border-color:#BBD9C0}
.sbadge.warn{background:#FFF1D6;color:#8A5A00;border-color:#F0CB86;cursor:pointer}
.stbar{display:flex;justify-content:flex-end;margin:0 0 8px}
.side .sbadge{margin:2px 0 8px;align-self:flex-start;font-size:11.5px}
@media(min-width:860px){.stbar{display:none}}
.allergybox{background:#FBE3E0;border:2px solid #C0392B;color:#7B1E14;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:14px}
.blk{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:4px 0;padding:11px 14px;border-radius:14px;background:#FBE3E0;border:1.5px dashed #C0392B;color:#7B1E14;font-size:14px;opacity:.95;cursor:not-allowed}
.blk small{color:#9B2C20;text-align:right}
.rqres .blk{border-radius:0;margin:0;border-left:0;border-right:0}
.soft{color:#8A5A00;font-size:12px}
.slot.bad{background:#FBE3E0;border:2px solid #C0392B;color:#7B1E14}
.cnts{padding:12px}
.cgrid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:720px){.cgrid{grid-template-columns:1.4fr 1fr 1fr}}
.cpill{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;border:1.5px solid var(--line);background:#fff}
.cpill .ci{font-size:24px;line-height:1}.cpill .cb{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.cpill b{font-size:20px;line-height:1.1}.cpill span{font-size:13px}.cpill small{font-size:11.5px;color:var(--mute)}
.cpill .bar{display:block;height:6px;border-radius:6px;background:#eee;margin-top:5px;overflow:hidden}.cpill .bar u{display:block;height:100%;background:currentColor;border-radius:6px}
.cpill.ok{background:#E4F1E6;border-color:#BBD9C0;color:#2F6B3C}.cpill.low{background:#FFF8E6;border-color:#F0CB86;color:#8A5A00}.cpill.warn{background:#FFF1D6;border-color:#E3A33A;color:#8A4B00}
.cpill.ok span,.cpill.low span,.cpill.warn span{color:#333}.cpill.info{color:var(--terra)}.cpill.info span{color:#333}
.nsearch input,.ac input{padding-right:44px}
.clr{position:absolute;right:8px;top:7px;width:32px;height:32px;min-height:0;border:0;border-radius:50%;background:#EDE5DC;color:#555;font-size:15px;line-height:1;cursor:pointer;z-index:2}
.ac .clr,.nsearch .clr{display:inline-flex;align-items:center;justify-content:center}

  const t = tol.split(',');

    id, n, d, cu: cu.split(' '), meals: meals.split('').map(x => ({D:'desayuno',C:'comida',N:'cena',T:'tentempie',A:'aperitivo',P:'postre',B:'bebida'}[x])),
    prep, cook, df, base: 2,
    tol: { tp: t[0], od: +t[1], fa: +t[2], ac: +t[3], sw: +t[4], sp: +t[5], tx: t[6], fr: t[7] === 'F' },
    ing: ings.trim().split(/\s+/).map(s => { const [id, q] = s.split(':'); const c = /c$/.test(q); return { id, q: parseFloat(q), c }; }),
    steps: steps.map(s => { const [title, rest] = s.split('|'); const m = rest.match(/@(\d+)$/); return { title, text: rest.replace(/@\d+$/, ''), tm: m ? +m[1] : 0 }; })
  });
}

/* ===== MOTOR: formato, escalado, nutrición, VALIDACIÓN DE SEGURIDAD OBSTÉTRICA y RECOMENDACIÓN ===== */
const NAMES = { me:'Mediterránea', es:'Española', it:'Italiana', jp:'Japonesa', cn:'China', th:'Tailandesa', vn:'Vietnamita', nk:'Nikkei', kr:'Coreana', mx:'Mexicana', in:'India', gr:'Griega', fr:'Francesa', ar:'Árabe', tr:'Turca', fu:'Internacional / Fusión' };
const MEAL_LABEL = { desayuno:'Desayunos', comida:'Comidas', cena:'Cenas', tentempie:'Tentempiés', aperitivo:'Aperitivos', postre:'Postres saludables', bebida:'Bebidas' };
const FAM_LABEL = { pescado:'Pescado', marisco:'Marisco', crustaceos:'Crustáceos', moluscos:'Moluscos', carne:'Carne (todas)', carne_roja:'Carne roja', ave:'Aves (pollo, pavo)', cerdo:'Cerdo', huevo:'Huevo', lacteo:'Lácteos', gluten:'Gluten', cereal:'Cereales', frutos_secos:'Frutos secos', cacahuete:'Cacahuete', soja:'Soja', sesamo:'Sésamo', legumbres:'Legumbres', ajo:'Ajo', cebolla:'Cebolla', coco:'Coco', frito:'Alimentos fritos', picante:'Picante', olores_intensos:'Olores intensos', graso:'Preparaciones grasas', acido:'Sabor ácido', dulce:'Sabor dulce' };
const COOK_VERB = /(cocin|cuece|cocer|cuez|hierv|hervir|hornea|asar|asa |plancha|saltea|fr[ií]e|dora|guis|vapor|cuaj|tuesta|estofa|rehog|pocha|gratin|marmit|caramel)/i;
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- formato de cantidades ---------- */
function rq(q, unit) { // redondeo culinario coherente
  if (unit === 'u') return Math.max(0.5, Math.round(q * 2) / 2);
  if (q < 10) return Math.max(0.5, Math.round(q * 2) / 2);
  if (q < 50) return Math.round(q);
  return Math.round(q / 5) * 5;
}
function fmtN(n) {
  const fl = Math.floor(n + 1e-9), fr = n - fl;
  if (Math.abs(fr - 0.5) < 1e-6) return fl === 0 ? '½' : fl + '½';
  return (Math.round(n * 10) / 10).toString().replace('.', ',');
}
function nameOf(id, q) {
  const g = ING[id]; if (!g) return id;
  if (g.u === 'u' && g.un) return q > 1 ? g.un[1] : g.un[0];
  return g.n;
}
function qtyText(id, q) {
  const g = ING[id];
  if (g.u === 'u') return fmtN(q) + ' ' + nameOf(id, q);
  let t = fmtN(q) + ' ' + g.u + ' de ' + g.n;
  if (g.sp && g.id !== 'agua') {
    const ts = q / g.sp;
    if (ts >= 0.9 && ts <= 12) {
      const tsp = Math.round(ts * 2) / 2;
      if (tsp < 3) t += ' (≈ ' + fmtN(tsp) + ' cdta.)';
      else { const tb = Math.round(ts / 3 * 2) / 2; t += ' (≈ ' + fmtN(tb) + ' cda.)'; }
    }
  }
  return t;
}

/* ---------- compilación de pasos (tokens) ---------- */
const TOK = /\{([a-z_]+)(?::([\d.]+))?\}/g;
function compileSteps(r) {
  r.steps.forEach(s => {
    const parts = []; let last = 0, m; TOK.lastIndex = 0;
    while ((m = TOK.exec(s.text))) {
      if (m.index > last) parts.push({ t: 'x', v: s.text.slice(last, m.index) });
      parts.push({ t: 'q', id: m[1], p: m[2] ? parseFloat(m[2]) : null });
      last = m.index + m[0].length;
    }
    if (last < s.text.length) parts.push({ t: 'x', v: s.text.slice(last) });
    s.parts = parts;
  });
}

/* ---------- vista de receta: comensales + sustituciones ---------- */
function materialize(r, diners, subs) {
  subs = subs || {};
  const scale = diners / r.base;
  const eff = r.ing.map(i => {
    const sb = subs[i.id]; const id = sb ? sb.id : i.id; const f = sb ? sb.f : 1;
    return { slot: i.id, id, f, c: i.c, qb: i.q * f, q: rq(i.q * f * scale, ING[id] ? ING[id].u : 'g') };
  });
  const bySlot = {}; eff.forEach(e => bySlot[e.slot] = e);
  // reparto de cantidades parciales: el último absorbe el redondeo para que la suma coincida con el listado
  const partial = {};
  r.steps.forEach((s, si) => s.parts.forEach((p, pi) => { if (p.t === 'q' && p.p !== null) (partial[p.id] = partial[p.id] || []).push([si, pi]); }));
  const amt = {};
  Object.keys(partial).forEach(slot => {
    const e = bySlot[slot]; if (!e) return; const list = partial[slot]; let acc = 0;
    list.forEach(([si, pi], k) => {
      const p = r.steps[si].parts[pi];
      let v = k === list.length - 1 ? +(e.q - acc).toFixed(2) : rq(p.p * e.f * scale, ING[e.id].u);
      if (v <= 0) v = 0.5; acc += v; amt[si + ':' + pi] = v;
    });
  });
  const steps = r.steps.map((s, si) => {
    const seen = {};
    const text = s.parts.map((p, pi) => {
      if (p.t === 'x') return p.v;
      const e = bySlot[p.id]; if (!e) return '⟦' + p.id + '⟧';
      if (p.p !== null) return qtyText(e.id, amt[si + ':' + pi]);
      if (seen[p.id]) return ING[e.id].u === 'u' ? nameOf(e.id, e.q) : ING[e.id].n;
      seen[p.id] = 1; return qtyText(e.id, e.q);
    }).join('');
    const used = []; s.parts.forEach((p, pi) => { if (p.t === 'q' && bySlot[p.id]) { const e = bySlot[p.id]; if (!used.some(u => u.slot === p.id)) used.push({ slot: p.id, id: e.id, q: p.p !== null ? amt[si + ':' + pi] : e.q }); } });
    return { title: s.title, text, tm: s.tm, used };
  });
  return { diners, eff, steps };
}

/* ---------- nutrición (por ración, a partir de ingredientes crudos; estimación) ---------- */
function nutrition(r, subs) {
  subs = subs || {};
  const t = { kcal: 0, p: 0, c: 0, f: 0, s: 0, fi: 0, salt: 0, fe: 0, fol: 0, ca: 0, io: 0, o3: 0 };
  r.ing.forEach(i => {
    const sb = subs[i.id]; const id = sb ? sb.id : i.id; const g = ING[id]; if (!g) return;
    const q = i.q * (sb ? sb.f : 1); const grams = g.u === 'u' ? q * g.ug : q * g.d;
    ['k', 'p', 'c', 'f', 's', 'fi'].forEach(k => { t[k === 'k' ? 'kcal' : k] += g[k] * grams / 100; });
    ['fe', 'fol', 'ca', 'io', 'o3'].forEach(k => { t[k] += (g[k] || 0) * grams / 100; });
    if (id === 'sal') t.salt += grams;
  });
  Object.keys(t).forEach(k => t[k] = t[k] / r.base);
  return t;
}

/* ===================== MOTOR DE SEGURIDAD ALIMENTARIA OBSTÉTRICA =====================
   Reglas independientes (ingredientes, técnicas, temperaturas, pasteurización, conservación, higiene).
   La seguridad es un filtro excluyente: NO APTA nunca se muestra. Si falta información → NO APTA. */
function effIngredients(r, subs) {
  subs = subs || {};
  return r.ing.map(i => { const sb = subs[i.id]; return { slot: i.id, id: sb ? sb.id : i.id, c: i.c, q: i.q * (sb ? sb.f : 1) }; });
}
/* Origen de cada criterio: se distingue SIEMPRE norma oficial (AESAN) de criterio prudencial propio y de referencia internacional */
const SRC = { A: 'AESAN', P: 'criterio prudencial de esta app', I: 'referencia internacional, no es norma española' };
const HEAT = s => COOK_VERB.test(s.title + ' ' + s.text) && !/sin cocinar|sin cocci[oó]n/i.test(s.title + ' ' + s.text);
const stepsUsing = (r, slot) => { const a = []; r.steps.forEach((s, i) => { if (s.parts.some(p => p.t === 'q' && p.id === slot)) a.push(i); }); return a; };
const WASH_AESAN = 'Frutas, verduras y hierbas que se toman crudas: lávalas y desinféctalas (AESAN: agua con 4 gotas de lejía apta para desinfección de agua de bebida por litro, 10 min, y aclarar con agua potable).';
const Rules = {
  ingredientes(r, eff, out) {
    eff.forEach(e => {
      if (UNSAFE[e.id]) out.bad.push(UNSAFE[e.id].n + ': ' + UNSAFE[e.id].why);
      else if (!ING[e.id]) out.bad.push('Ingrediente sin datos de seguridad: ' + e.id);
      else if (ING[e.id].hg === 'alto') out.bad.push(ING[e.id].n + ': alto contenido en mercurio (AESAN).');
    });
    if (!r.tol || !r.steps || !r.steps.length || typeof r.cook !== 'number') out.bad.push('Faltan datos de la receta; no se puede garantizar su seguridad.');
  },
  /* Analiza la receta completa: para cada proteína animal comprueba, paso a paso, que se cocina DESPUÉS de añadirla,
     que no se añade tras el último paso con calor y que la cocción tiene tiempo declarado. Un verbo suelto no basta. */
  tecnicas(r, eff, out) {
    const heat = r.steps.map(HEAT); const lastHeat = heat.lastIndexOf(true);
    eff.forEach(e => {
      const g = ING[e.id]; if (!g || !g.an || g.ok) return; const nm = cap(g.n);
      if (!e.c) { out.bad.push(nm + ' debe cocinarse por completo y la receta no lo garantiza.'); return; }
      const uses = stepsUsing(r, e.slot);
      if (!uses.length) { out.bad.push(nm + ' figura en los ingredientes pero ningún paso indica cómo se cocina.'); return; }
      const first = uses[0], last = uses[uses.length - 1];
      if (!heat.slice(first).some(Boolean)) { out.bad.push('Ningún paso aplica calor a ' + g.n + ' después de añadirlo (técnica no verificable).'); return; }
      if (last > lastHeat) out.bad.push(nm + ' se añade después del último paso con calor: quedaría sin cocinar.');
      const timed = r.steps.slice(first, lastHeat + 1).some((s, i) => heat[first + i] && (s.tm > 0 || /\d+(?:-\d+)? ?min/i.test(s.text)));
      if (!timed) out.bad.push('No se indica tiempo de cocción para ' + g.n + '.');
      if (!(r.cook > 0)) out.bad.push('Tiempo de cocción no declarado para ' + g.n + '.');
    });
  },
  temperaturas(r, eff, out) {
    const an = eff.map(e => ING[e.id]).filter(g => g && g.an && !g.ok);
    if (an.some(g => g.fam.includes('huevo'))) out.cook.push('Huevo: cocinar hasta que clara y yema estén firmes, sin zonas líquidas (criterio prudencial; la AESAN indica evitar el huevo crudo y las preparaciones con huevo crudo).');
    if (an.some(g => !g.fam.includes('huevo'))) out.cook.push('Carne, ave y pescado: que el centro supere los 70 °C durante al menos 2 minutos, sin partes rosadas (AESAN: tríptico «Alimentación segura en el embarazo» y ficha de Listeriosis; la web del DSCA indica 71 °C para la carne).');
    if (an.some(g => g.fam.includes('marisco'))) out.cook.push('Marisco: siempre bien cocinado; la AESAN indica evitar ostras, almejas y mejillones crudos.');
    if (an.some(g => g.fam.includes('carne') && /picad/.test(g.n))) out.cook.push('La carne picada se cocina siempre por completo, también el centro de albóndigas y hamburguesas (criterio prudencial).');
  },
  pasteurizacion(r, eff, out) {
    eff.forEach(e => {
      const g = ING[e.id]; if (!g) return; const nm = g.n.replace(/ \(.*\)/, '');
      if (g.pa === 2) { out.caut.push('Comprueba en la etiqueta que el ' + nm + ' está hecho con leche pasteurizada; si no lo indica, no lo uses (AESAN).'); out.pasteur.push(cap(nm) + ': solo con etiqueta de leche pasteurizada (AESAN). Quita la corteza si la tiene.'); }
      else if (g.pa === 1) { out.caut.push('Comprueba que ' + nm + ' es pasteurizado (etiqueta).'); out.pasteur.push(cap(nm) + (g.grp === 'queso' ? ': compra la pieza y rállala tú; evita el queso rallado o loncheado industrial y quita la corteza (AESAN).' : ': producto pasteurizado.')); }
      else if (g.fam.includes('lacteo')) out.pasteur.push(cap(g.n) + ': usar leche/yogur pasteurizado o UHT; nunca leche cruda (AESAN).');
    });
  },
  conservacion(r, eff, out) {
    const an = eff.some(e => ING[e.id] && ING[e.id].an);
    const cold = r.tol.tp === 'c';
    out.store.push('No dejes las sobras más de 2 horas a temperatura ambiente; guárdalas cuanto antes en recipientes cerrados en el frigorífico (≤ 5 °C) y separadas de crudos y quesos (AESAN).');
    out.store.push('Las sobras no se toman frías: recaliéntalas por encima de 75 °C (AESAN, web del DSCA) y no las dejes más de 2 h a temperatura ambiente (tríptico AESAN).');
    if (an) out.store.push('Consumo en 24 h como máximo (criterio prudencial de esta app; la AESAN remite a la fecha de caducidad y a la cadena de frío).');
    if (cold && an) out.caut.push('Se sirve frío con proteína animal cocinada: mantén la cadena de frío (≤ 5 °C) y consúmelo el mismo día (criterio prudencial).');
  },
  higiene(r, eff, out) {
    out.hand.push('Lávate las manos al menos 20 segundos con agua caliente y jabón antes y después de manipular alimentos; lava a fondo manos, superficies y utensilios tras tocar carne, pescado o huevo (AESAN).');
    out.hand.push('Usa tablas y cuchillos distintos para crudo y cocinado (criterio prudencial; contaminación cruzada).');
    const heat = r.steps.map(HEAT);

  const al = {}; Object.keys(ALIAS).forEach(a => ALIAS[a].forEach(k => (al[k] = al[k] || []).push(a)));
  const one = (l, q) => { const root = l.replace(/ ?\(.*\)/, ''); if (root === q) return -1; if (l.startsWith(q)) return 0; if (l.split(/[ (\/]/).some(w => w.startsWith(q))) return 1; if (l.includes(q)) return 2; return 9; };

  return catalog(cs).filter(it => !have.includes(it.key)).map(it => [sc(it), it]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || TP[a[1].type] - TP[b[1].type] || a[1].label.length - b[1].label.length).slice(0, 8).map(x => x[1]);

(function () {

    const man = { name: 'Gestanut', short_name: 'Gestanut', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#F7F1E3', theme_color: '#F7F1E3', lang: 'es', icons: [png ? { src: png, sizes: '180x180', type: 'image/png', purpose: 'any' } : null, svgHref ? { src: svgHref, sizes: 'any', type: 'image/svg+xml', purpose: 'any' } : null].filter(Boolean) };

    im.onerror = () => mkManifest(null); im.src = svgHref;
  } catch (e) { mkManifest(null); }
})();
